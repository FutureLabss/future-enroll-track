name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly — mutation testing is too slow to gate every push

jobs:
  gauntlet:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (full codebase — informational, pre-existing debt not yet gated)
        run: npm run lint
        continue-on-error: true

      - name: Lint (changed lines only — blocking)
        run: npm run lint:changed

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Coverage (informational — no threshold set yet)
        run: |
          npm run test:coverage
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            console.log('Lines: ' + t.lines.pct + '% | Statements: ' + t.statements.pct + '% | Functions: ' + t.functions.pct + '% | Branches: ' + t.branches.pct + '%');
          "

  mutation-testing:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Mutation testing (hooks/lib layer with existing tests)
        run: npm run test:mutation
